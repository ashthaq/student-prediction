<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student performance prediction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student performence prediction</h1>
        <p>Predict student results using Machine learning</p>
        <form id="predictionForm">
            <label for="studyHours">Study Hours Per Day</label>
            <input type="number" 
            id="studyHours"
            min="0"
            max="24"
            step="0.1"
            placeholder="Enter Study hours"
            required
            >
            <label for="attendance">Attendance Rate(%)</label>
            <input type="number"
            id="attendance"
            min="0"
            max="100"
            step="0.1"
            placeholder="Enter Attendence Percentage"
            required
            >
            <button type="submit">Predict Result</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
